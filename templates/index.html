<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ethereum Fraud Detector</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0b0d14;
      color: #d1d5db;
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    header h1 {
      font-size: 1.7rem;
      color: #a78bfa;
      letter-spacing: -0.02em;
    }
    header p {
      margin-top: 0.4rem;
      font-size: 0.85rem;
      color: #6b7280;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
      max-width: 1100px;
      margin: 0 auto 2rem;
    }

    .field {
      background: #13161f;
      border: 1px solid #1f2336;
      border-radius: 10px;
      padding: 0.9rem 1rem;
      transition: border-color 0.2s;
    }
    .field:focus-within { border-color: #7c3aed; }

    .field label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: #c4b5fd;
      margin-bottom: 0.25rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .field .hint {
      font-size: 0.7rem;
      color: #4b5563;
      margin-bottom: 0.4rem;
      line-height: 1.3;
    }
    .field input {
      width: 100%;
      background: #0b0d14;
      border: 1px solid #1f2336;
      border-radius: 6px;
      color: #e5e7eb;
      font-size: 0.88rem;
      padding: 0.45rem 0.6rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .field input:focus { border-color: #7c3aed; }
    .field input::placeholder { color: #374151; }

    .actions {
      text-align: center;
      margin-bottom: 2rem;
    }
    button {
      padding: 0.75rem 2.5rem;
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover  { background: #6d28d9; }
    button:active { transform: scale(0.98); }

    #result {
      max-width: 480px;
      margin: 0 auto;
      padding: 1.2rem 1.5rem;
      border-radius: 12px;
      display: none;
      text-align: center;
    }
    #result.fraud { background: #2a1212; border: 1px solid #dc2626; }
    #result.legit { background: #0f2318; border: 1px solid #16a34a; }
    #result.error { background: #1f1a0a; border: 1px solid #d97706; }

    #result .verdict {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.35rem;
    }
    #result.fraud .verdict { color: #f87171; }
    #result.legit .verdict { color: #4ade80; }
    #result.error .verdict { color: #fbbf24; }

    #result .prob {
      font-size: 0.85rem;
      color: #9ca3af;
    }

    .spinner { display: none; }
    button.loading .spinner { display: inline-block; margin-left: 6px; }
  </style>
</head>
<body>

<header>
  <h1>⟠ Ethereum Fraud Detector</h1>
  <p>Fill in the account's transaction statistics below, then click Analyze.</p>
</header>

<div class="form-grid" id="featureGrid">
  {% for key, label, hint in features %}
  <div class="field">
    <label title="{{ label }}">{{ label }}</label>
    <div class="hint">{{ hint }}</div>
    <input type="number" step="any" id="feat_{{ loop.index0 }}"
           data-key="{{ key }}" placeholder="0" />
  </div>
  {% endfor %}
</div>

<div class="actions">
  <button onclick="analyze(this)">
    Analyze Transaction <span class="spinner">⏳</span>
  </button>
</div>

<div id="result">
  <div class="verdict" id="verdict"></div>
  <div class="prob"    id="prob"></div>
</div>

<script>
  async function analyze(btn) {
    const inputs = document.querySelectorAll('#featureGrid input');
    const features = Array.from(inputs).map(i => parseFloat(i.value) || 0);

    const resultBox = document.getElementById('result');
    const verdict   = document.getElementById('verdict');
    const prob      = document.getElementById('prob');

    resultBox.style.display = 'none';
    btn.disabled = true;
    btn.classList.add('loading');

    try {
      const res  = await fetch('/predict', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ features })
      });
      const data = await res.json();

      if (data.error) throw new Error(data.error);

      resultBox.className = data.prediction === 1 ? 'fraud' : 'legit';
      verdict.textContent  = data.prediction === 1
        ? '🚨 Fraudulent Account Detected'
        : '✅ Account Appears Legitimate';
      prob.textContent = `Fraud probability: ${data.fraud_probability}%`;
    } catch (err) {
      resultBox.className = 'error';
      verdict.textContent  = '⚠ ' + err.message;
      prob.textContent     = '';
    }

    resultBox.style.display = 'block';
    btn.disabled = false;
    btn.classList.remove('loading');
    resultBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
</script>

</body>
</html>
